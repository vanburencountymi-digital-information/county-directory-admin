services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: directory
      POSTGRES_PASSWORD: directory
      POSTGRES_DB: directory_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directory -d directory_test"]
      interval: 2s
      timeout: 5s
      retries: 10
